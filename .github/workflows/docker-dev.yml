name: docker-dev
on:
  push:
    branches:
      - 'development'
permissions: read-all

env:
  # From https://hub.docker.com/r/duncdrum/existdb/tags
  EXISTDB_VERSION: 6.2.0-debug-j8
  TEMPLATING_VERSION: 1.1.0
  PUBLISHER_LIB_VERSION: 4.0.0
  ROUTER_VERSION: 1.8.0

jobs:
  build:
    name: Build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: linux/amd64
          - os: ubuntu-24.04-arm
            arch: linux/arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: development

      - name: Build image
        uses: unil-lettres/actions/docker-build@main
        with:
          dockerfile: ./Dockerfile
          target: existdb
          platform: ${{ matrix.arch }}
          image_repository: ${{ vars.DOCKERHUB_REPOSITORY }}
          name_prefix: existdb
          dockerhub_username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub_token: ${{ secrets.DOCKERHUB_TOKEN }}
          build_args: |
            EXISTDB_VERSION=${{ env.EXISTDB_VERSION }}
            TEMPLATING_VERSION=${{ env.TEMPLATING_VERSION }}
            PUBLISHER_LIB_VERSION=${{ env.PUBLISHER_LIB_VERSION }}
            ROUTER_VERSION=${{ env.ROUTER_VERSION }}

  merge:
    name: Merge
    runs-on: ubuntu-latest
    needs: [build]

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: development

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Merge digests
        uses: unil-lettres/actions/docker-merge@main
        with:
          image_repository: ${{ vars.DOCKERHUB_REPOSITORY }}
          tag: latest-stage
          dockerhub_username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub_token: ${{ secrets.DOCKERHUB_TOKEN }}


  update-description:
    name: Update Description
    runs-on: ubuntu-latest
    needs: [merge]
    if: success()
    continue-on-error: false

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: development

      - name: Update description
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ vars.DOCKERHUB_REPOSITORY }}
